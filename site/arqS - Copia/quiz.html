<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz da Nossa História</title>
  <link rel="stylesheet" href="style2.css">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="https://images.vexels.com/media/users/3/235900/isolated/lists/5665592ae394923e3eaf761c663c0fcf-emoji-de-sapo-de-aniversario.png" type="image/x-icon">
</head>
<body>

  <div class="container">
    <div class="progresso">
      <span class="ativo"></span>
      <span class="ativo"></span>
      <span class="ativo"></span>
      <span></span>
      <span></span>
    </div>

    <h2>Agora vai um incrivel quiz muitoo dificil</h2>

    <p class="legenda-chat">5 perguntinhas sobre tudo</p>

    <div class="card quiz" id="quiz">
      <div class="quiz-topo">
        <span class="quiz-contador" id="quiz-contador">Pergunta 1 de 5</span>
        <div class="quiz-barra"><span id="quiz-barra-preenchida"></span></div>
      </div>

      <h3 class="quiz-pergunta" id="quiz-pergunta"></h3>

      <div class="quiz-opcoes" id="quiz-opcoes"></div>

      <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>

      <button type="button" class="btn quiz-btn-proximo" id="quiz-proximo" hidden>Próxima</button>
    </div>

    <div class="card quiz-final" id="quiz-final" hidden>
      <p class="quiz-final-titulo" id="quiz-final-titulo"></p>
      <p id="quiz-final-texto"></p>
      <a href="motivos.html" class="btn">Avançar</a>
    </div>
  </div>

  <script src="script2.js"></script>
  <script src="script.js"></script>
</body>
</html>
